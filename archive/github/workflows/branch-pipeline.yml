name: Branch Pipeline

on:
  # Automatic triggers commented out for manual control
  # push:
  #   branches:
  #     - main
  #     - develop
  #     - 'release/**'
  #     - 'feature/**'
  #     - 'bugfix/**'
  #     - 'hotfix/**'
  # pull_request:
  #   branches:
  #     - main
  #     - develop
  
  # Manual workflow dispatch only
  workflow_dispatch:
    # inputs:
    #   branch:
    #     description: 'Branch to run workflow on'
    #     required: false
    #     default: 'develop'
    #     type: string
    #   environment:
    #     description: 'Target environment'
    #     required: true
    #     default: 'staging'
    #     type: choice
    #     options:
    #       - staging
    #       - production
    #       - preview
    #   skip_tests:
    #     description: 'Skip test execution'
    #     required: false
    #     default: false
    #     type: boolean
permissions: write-all

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      packages: ${{ steps.filter.outputs.packages }}
      services: ${{ steps.filter.outputs.services }}
      tools: ${{ steps.filter.outputs.tools }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            apps:
              - 'apps/**'
            packages:
              - 'packages/**'
            services:
              - 'services/**'
            tools:
              - 'tools/**'
            docs:
              - 'docs/**'

  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Validate branch naming
        run: |
          # Use manual input branch if provided, otherwise detect from GitHub context
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH_NAME="${{ inputs.branch }}"
          else
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi

          VALID_PATTERN="^(main|develop|(feature|bugfix|hotfix|release|chore)\/[a-z-]+\/[A-Z0-9-]+(-[a-z0-9-]+)*|chore\/[a-z-]+\/[a-z0-9-]+)$"

          echo "Validating branch: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ $VALID_PATTERN ]]; then
            echo "❌ Branch name '$BRANCH_NAME' does not follow naming convention"
            echo "✅ Use: feature/[scope]/[TICKET]-[description]"
            echo "✅ Examples:"
            echo "   - feature/web/JIRA-123-add-user-auth"
            echo "   - bugfix/api/JIRA-456-fix-memory-leak"
            echo "   - hotfix/JIRA-789-critical-security-patch"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH_NAME' follows naming convention"

  setup:
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-branch]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.detect-changes.outputs.apps == 'true' || needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.services == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Run linting
        run: pnpm turbo run lint --affected

  type-check:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.detect-changes.outputs.apps == 'true' || needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.services == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Run type checking
        run: pnpm turbo run type-check --affected

  test:
    runs-on: ubuntu-latest
    needs: setup
    if: |
      (needs.detect-changes.outputs.apps == 'true' || needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.services == 'true') &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_tests != true)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Run unit tests
        run: pnpm turbo run test --affected
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: [setup, lint, type-check, test]
    if: needs.detect-changes.outputs.apps == 'true' || needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.services == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Build packages
        run: pnpm turbo run build --affected
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
            services/*/dist

  security-scan:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Run dependency security audit
        run: pnpm audit --audit-level moderate
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          languages: javascript,typescript

  deploy-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'preview'
    needs: [build]
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Deploy to preview environment
        run: |
          BRANCH_NAME="${{ inputs.branch || github.ref_name }}"
          PREVIEW_URL="https://${BRANCH_NAME//\//-}.preview.company.com"
          echo "🚀 Deploying to preview: $PREVIEW_URL"
          echo "Branch: $BRANCH_NAME"
          # Add actual deployment logic here

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment"
          echo "Branch: ${{ inputs.branch || github.ref_name }}"
          # Add actual deployment logic here

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment"
          echo "Branch: ${{ inputs.branch || github.ref_name }}"
          # Add actual deployment logic here

  notify:
    if: always()
    needs: [deploy-preview, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment status
        run: |
          if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "✅ Staging deployment successful"
          elif [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "✅ Production deployment successful"
          elif [[ "${{ needs.deploy-preview.result }}" == "success" ]]; then
            echo "✅ Preview deployment successful"
          fi
